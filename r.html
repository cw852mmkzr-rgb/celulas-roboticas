<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Relatório de Produção — Trenisp/Tremps Robotics</title>
<meta name="description" content="Dashboard interativo de produção">
<meta property="og:type" content="article">
<meta property="og:title" content="Relatório de Produção — Trenisp/Tremps Robotics">
<meta property="og:description" content="Dashboard interativo de produção — toque para abrir">
<meta name="theme-color" content="#0a0d12">
<style>
  html,body{margin:0;padding:0;background:radial-gradient(ellipse at top,#141a22,#0a0d12 60%,#05070a);color:#e8ecf3;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased}
  .loader{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:20px;text-align:center}
  .sp{width:48px;height:48px;border:3px solid rgba(0,232,122,.15);border-top-color:#00e87a;border-radius:50%;animation:sp 1s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  .lb{color:#a8b3c4;font-size:14px;letter-spacing:.4px}
  .err{max-width:420px;padding:34px 30px;background:rgba(20,26,34,.6);border:1px solid #1e2632;border-radius:16px}
  .err .i{font-size:52px;margin-bottom:12px}
  .err h1{font-size:22px;color:#ff6b6b;margin:0 0 10px;font-weight:700}
  .err p{color:#a8b3c4;font-size:14.5px;line-height:1.5;margin:0}
</style>
</head>
<body>
<div class="loader" id="lo">
  <div class="sp"></div>
  <div class="lb">Carregando relatório…</div>
</div>
<script>
(function(){
  const SUPABASE_URL = "https://dtsrisqueekmommmoqxf.supabase.co";
  const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR0c3Jpc3F1ZWVrbW9tbW1vcXhmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEyMjEwMzIsImV4cCI6MjA5Njc5NzAzMn0.Zdo1zJraLw0BanX-o9A2SreMr9tiVHvgrIyTeNqQC6g";

  function showErro(titulo, msg){
    document.getElementById('lo').innerHTML =
      '<div class="err"><div class="i">⚠️</div><h1>'+titulo+'</h1><p>'+msg+'</p></div>';
  }

  const id = (new URLSearchParams(location.search).get('id')||'').trim();
  if(!id || !/^[a-zA-Z0-9_-]{4,64}$/.test(id)){
    showErro('Link inválido','O link do relatório está mal formado ou incompleto.');
    return;
  }

  fetch(SUPABASE_URL+'/rest/v1/relatorios_publicos?id=eq.'+encodeURIComponent(id)+'&select=html', {
    headers: {'apikey': SUPABASE_KEY, 'Authorization': 'Bearer '+SUPABASE_KEY}
  })
  .then(r => { if(!r.ok) throw new Error(r.status); return r.json(); })
  .then(rows => {
    if(!rows || !rows[0] || !rows[0].html){
      showErro('Relatório não encontrado','Este relatório pode ter expirado ou nunca existiu. Gere um novo pelo sistema.');
      return;
    }
    document.open();
    document.write(rows[0].html);
    document.close();
  })
  .catch(e => {
    console.error(e);
    showErro('Erro ao carregar','Não foi possível carregar o relatório agora. Tente novamente em instantes.');
  });
})();
</script>
</body>
</html>
